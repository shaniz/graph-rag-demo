[project]
name = "graph-rag-demo"
version = "0.1.0"
description = "GraphRAG demo using Microsoft GraphRAG v3 for IT troubleshooting knowledge graphs"
requires-python = ">=3.11"
dependencies = [
    "graphrag>=2.0.0",
    "networkx>=3.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
